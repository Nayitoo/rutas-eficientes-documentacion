<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parada no encontrada · Rutas Eficientes</title>
<meta name="description" content="Esta dirección no forma parte del sitio de Rutas Eficientes. Volvé a la presentación del producto o a la documentación.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/rutas-eficientes-documentacion/favicon.png">
<style>
  @font-face{font-family:'Overpass';src:url('/rutas-eficientes-documentacion/landing/fonts/overpass-100_900-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Overpass Mono';src:url('/rutas-eficientes-documentacion/landing/fonts/overpass-mono-300_700-normal.woff2') format('woff2');font-weight:300 700;font-display:swap}
  :root{--ground:#EDF1EE;--surface:#F6F8F6;--ink:#0E1B17;--muted:#4C5B54;--line:rgb(14 27 23 / .14);--accent:#12A07A;--accent-ink:#0B6E55}
  *{box-sizing:border-box;margin:0}
  body{min-height:100dvh;display:grid;align-content:center;gap:2.2rem;padding:2rem clamp(1rem,4vw,2.5rem);
    background:var(--ground);color:var(--ink);font:1.05rem/1.55 'Overpass',system-ui,sans-serif}
  .mapa{width:min(560px,100%);aspect-ratio:560/180;border:1px solid var(--line);border-radius:14px;background-color:var(--surface);
    background-image:radial-gradient(rgb(14 27 23 / .16) 1px,transparent 1.4px);background-size:26px 26px}
  .mapa path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:clamp(2.6rem,1.2rem + 5vw,5.6rem);font-weight:800;line-height:.95;letter-spacing:-.045em;max-width:14ch}
  p{color:var(--muted);max-width:44ch}
  .codigo{font:600 .85rem/1 'Overpass Mono',monospace;color:var(--accent-ink)}
  nav{display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:.6em;padding:.95em 1.5em;border-radius:999px;background:var(--ink);color:var(--ground);font-weight:700;text-decoration:none;
    transition:background .3s}
  .btn span{display:inline-block;transition:translate .4s cubic-bezier(.16,1,.3,1)}
  .link{color:var(--ink);font-weight:600;text-decoration:none;background:linear-gradient(rgb(18 160 122 / .28) 0 0) left bottom / 100% 2px no-repeat;
    transition:background-size .4s cubic-bezier(.16,1,.3,1)}
  @media (hover:hover){.btn:hover{background:var(--accent-ink)}.btn:hover span{translate:-4px 0}.link:hover{background-size:100% .55em}}
  :focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:4px}
  .btn:focus-visible{background:var(--accent-ink)}
</style>
</head>
<body>
  <svg class="mapa" viewBox="0 0 560 180" aria-hidden="true" focusable="false">
    <path d="M60 130 L170 70 L290 112" stroke="#12A07A" stroke-width="6"/>
    <path d="M290 112 L420 64" stroke="#4C5B54" stroke-width="2" stroke-dasharray="3 9"/>
    <g transform="translate(60 130)"><circle r="10" fill="#0B6E55"/></g>
    <g transform="translate(170 70)"><circle r="10" fill="#0B6E55"/></g>
    <g transform="translate(290 112)"><circle r="10" fill="#0B6E55"/></g>
    <g transform="translate(450 54)" stroke="#0E1B17" stroke-width="4" stroke-linecap="round"><path d="M-12 -12 L12 12 M12 -12 L-12 12"/></g>
  </svg>
  <main>
    <p class="codigo">Error 404</p>
    <h1>Esta parada no está en la ruta.</h1>
    <p style="margin-top:1rem">La dirección que buscaste no existe en este sitio. Puede que el enlace esté mal escrito o que la página se haya movido.</p>
  </main>
  <nav aria-label="Volver">
    <a class="btn" href="/rutas-eficientes-documentacion/landing/"><span aria-hidden="true">←</span> Volver a la presentación</a>
    <a class="link" href="/rutas-eficientes-documentacion/">Ir a la documentación</a>
  </nav>
</body>
</html>
